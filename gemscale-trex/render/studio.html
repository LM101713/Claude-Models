<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gemscale T-Rex Studio</title>
<style>
html,body{margin:0;background:#0b0b10;overflow:hidden;font-family:"DejaVu Sans",Verdana,sans-serif}
canvas{display:block}
#promo{position:absolute;left:62px;bottom:52px;color:#fff;display:none}
#promo .t1{font-size:88px;font-weight:800;letter-spacing:2px;line-height:1}
#promo .t2{font-size:108px;font-weight:800;letter-spacing:2px;line-height:1.02}
#promo .sub{font-size:31px;font-weight:700;margin:14px 0 30px;color:#e8ebf5}
#promo .tags span{display:inline-block;padding:12px 18px;margin-right:14px;border-radius:12px;font-size:28px;font-weight:800;color:#1b1b22;letter-spacing:1px}
</style>
<script type="importmap">
{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="promo"><div class="t1">FLEXI</div><div class="t2">T-REX</div>
<div class="sub">Print-in-place &bull; Tiny arms &bull; Fast print</div>
<div class="tags"><span>NO SUPPORTS</span><span>NO ASSEMBLY</span><span>FAST PRINT</span></div></div>
<script type="module">
// Render studio for the Gemscale Flexi T-Rex.
// Query: ?glb=<file>&parts=<json>&view=hero|top|face|plate&scheme=<name>&w=1600&h=1200
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 1600), H = +(q.get("h") || 1200);
const view = q.get("view") || "hero";
const scheme = q.get("scheme") || "jungle";

// colour stops from the body (t=0) to the tentacle tips (t=1)
const SCHEMES = {
  jungle:    { stops: ["#2f8f3a", "#5fb83f", "#b8d83a", "#ffd23f"], rough: 0.3,  metal: 0.1,  rim: ["#ffb35a", "#5ab4ff"] },
  lava:      { stops: ["#7a1010", "#d8321c", "#ff7a1a", "#ffd23f"], rough: 0.25, metal: 0.2,  rim: ["#ff8a2a", "#7a5cff"] },
  ice:       { stops: ["#2d6cdf", "#3fa4f5", "#8fe0ff", "#e8fbff"], rough: 0.22, metal: 0.25, rim: ["#5affc8", "#ff5ab4"] },
  bone:      { stops: ["#8a7a62", "#c9b896", "#eadfc4", "#fff7e0"], rough: 0.45, metal: 0.0,  rim: ["#ffc35a", "#5a8cff"] },
  galaxy:    { stops: ["#3a1f8f", "#7b2ff7", "#c33cff", "#ff5fd2"], rough: 0.2,  metal: 0.3,  rim: ["#b05cff", "#3dd6ff"] },
  blackgold: { stops: ["#1a1a1f", "#2a2622", "#b8862f", "#e8bd5a"], rough: 0.28, metal: 0.55, rim: ["#ffc35a", "#5a8cff"] },
};
const S = SCHEMES[scheme] || SCHEMES.jungle;
const ramp = t => {
  const n = S.stops.length - 1, x = Math.min(0.9999, Math.max(0, t)) * n, i = Math.floor(x);
  return new THREE.Color(S.stops[i]).lerp(new THREE.Color(S.stops[i + 1]), x - i);
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// backdrop: seamless slate-blue studio with a warm glow top-left (same look as the dragon covers)
const BG = new THREE.Color("#262c3a");
function floorTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#262c3a"; g.fillRect(0, 0, 1024, 1024);
  const grd = g.createRadialGradient(512, 512, 10, 512, 512, 512);
  grd.addColorStop(0, "#5a6072"); grd.addColorStop(0.4, "#3f4658"); grd.addColorStop(1, "#262c3a");
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 1024);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = BG;

// textured PEI plate: warm gold sheet with fine speckle
function peiTexture(size) {
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#6e5a36"; g.fillRect(0, 0, 1024, 1024);
  const img = g.getImageData(0, 0, 1024, 1024), d = img.data;
  let s = 12345; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < d.length; i += 4) {
    const v = (rnd() - 0.5) * 38 + (rnd() < 0.04 ? 30 : 0);
    d[i] += v; d[i + 1] += v * 0.9; d[i + 2] += v * 0.6;
  }
  g.putImageData(img, 0, 0);
  // printed grid marks like a real sheet
  g.strokeStyle = "rgba(20,15,8,0.35)"; g.lineWidth = 2;
  for (let k = 1; k < 6; k++) { const p = k * 1024 / 6; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 12); g.moveTo(p, 1024); g.lineTo(p, 1012); g.moveTo(0, p); g.lineTo(12, p); g.moveTo(1024, p); g.lineTo(1012, p); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function bumpTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d"), img = g.createImageData(1024, 1024), d = img.data;
  let s = 999; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < d.length; i += 4) { const v = 128 + (rnd() - 0.5) * 120; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); return t;
}

function roundedPlate(w, h, r, thick) {
  const sh = new THREE.Shape();
  sh.moveTo(-w / 2 + r, -h / 2); sh.lineTo(w / 2 - r, -h / 2); sh.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  sh.lineTo(w / 2, h / 2 - r); sh.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  sh.lineTo(-w / 2 + r, h / 2); sh.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  sh.lineTo(-w / 2, -h / 2 + r); sh.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: true, bevelSize: 0.8, bevelThickness: 0.8, bevelSegments: 2 });
  geo.translate(0, 0, -thick - 0.8);
  // planar UVs over the top
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / w + 0.5, pos.getY(i) / h + 0.5);
  return geo;
}

const up = new THREE.Vector3(0, 0, 1);
THREE.Object3D.DEFAULT_UP.copy(up);

async function main() {
  const parts = await (await fetch(q.get("parts"))).json();
  const gltf = await new GLTFLoader().loadAsync(q.get("glb"));
  const root = new THREE.Group();
  // the generator writes raw z-up millimetres into the GLB
  root.add(gltf.scene);
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const i = +o.name.replace(/\D/g, "") || +o.parent.name.replace(/\D/g, "") || 0;
    const p = parts[i] || { t: 0 };
    // faceted models get flat shading; smooth (sculpted) ones keep their vertex normals
    if (!p.smooth) { o.geometry = o.geometry.toNonIndexed(); o.geometry.computeVertexNormals(); }
    else if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = new THREE.MeshPhysicalMaterial({
      color: ramp(p.t), roughness: S.rough, metalness: S.metal, flatShading: !p.smooth,
      clearcoat: 0.35, clearcoatRoughness: 0.35, sheen: 0.3, sheenColor: ramp(Math.min(1, p.t + 0.2)),
    });
    o.castShadow = o.receiveShadow = true;
  });
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const R = Math.max(size.x, size.y) / 2;

  // floor: huge seamless plane that fades into the background
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(R * 16, R * 16),
    new THREE.MeshStandardMaterial({ map: floorTexture(), roughness: 0.95, metalness: 0 }));
  floor.position.set(ctr.x - R * 0.8, ctr.y - R * 0.4, -0.02);
  floor.receiveShadow = true;
  scene.add(floor);
  scene.fog = new THREE.Fog(BG, R * 6, R * 14);

  // textured PEI plate under the model in the plate view
  const plateW = Math.max(180, Math.ceil((Math.max(size.x, size.y) + 30) / 10) * 10);
  if (view === "plate") {
    const plate = new THREE.Mesh(roundedPlate(plateW, plateW, 8, 3),
      new THREE.MeshStandardMaterial({ map: peiTexture(), bumpMap: bumpTexture(), bumpScale: 0.6, roughness: 0.72, metalness: 0.35 }));
    plate.position.set(ctr.x, ctr.y, 0);
    plate.receiveShadow = true;
    scene.add(plate);
    root.position.z += 0.01;
  }

  // lights: warm key, two coloured rims, soft fill
  const key = new THREE.DirectionalLight("#fff3e0", 2.6);
  key.position.set(ctr.x - R * 1.2, ctr.y - R * 2.2, R * 3.2);
  key.target.position.copy(ctr);
  key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096);
  const sc = key.shadow.camera; sc.left = sc.bottom = -R * 2.5; sc.right = sc.top = R * 2.5; sc.near = 1; sc.far = R * 10;
  key.shadow.bias = -0.0004; key.shadow.radius = 4;
  scene.add(key, key.target);
  const rimA = new THREE.DirectionalLight(S.rim[0], 1.05); rimA.position.set(ctr.x + R * 2.5, ctr.y + R * 2.2, R * 1.2);
  const rimB = new THREE.DirectionalLight(S.rim[1], 1.8); rimB.position.set(ctr.x - R * 2.6, ctr.y + R * 1.8, R * 1.0);
  const fill = new THREE.HemisphereLight("#cfd6ff", "#2a2016", 0.4);
  scene.add(rimA, rimB, fill);

  // camera
  const cam = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
  const look = ctr.clone();
  let dir, dist;
  // the T. rex is long and low and faces -x (the head is on the left)
  const head = new THREE.Vector3(box.min.x + size.x * 0.17, box.max.y - size.y * 0.3, size.z * 0.3);
  if (view === "top") { dir = new THREE.Vector3(0, -0.12, 1); dist = size.x * 1.5; look.z = size.z * 0.2; }
  else if (view === "plate") { dir = new THREE.Vector3(0.3, -0.9, 1.35); dist = plateW * 1.75; look.z = 0; }
  else if (view === "face") { dir = new THREE.Vector3(-0.28, -0.5, 1.0); dist = size.x * 0.46; look.copy(head); }
  else { dir = new THREE.Vector3(-0.1, -0.3, 1.0); dist = size.x * 1.5; look.z = size.z * 0.15; }
  if (view === "promo") { dir = new THREE.Vector3(-0.06, -0.25, 1.0); dist = size.x * 1.55; }
  if (view === "promo") {
    look.x = ctr.x - size.x * 0.12; look.y = ctr.y - size.y * 0.42; look.z = 0;
    const accent = "#" + ramp(0.95).getHexString();
    const el = document.getElementById("promo");
    el.style.display = "block";
    el.querySelector(".t2").style.color = accent;
    el.querySelectorAll(".tags span").forEach(t => (t.style.background = accent));
  }
  cam.position.copy(look).add(dir.normalize().multiplyScalar(dist));
  cam.up.set(0, 0, 1);
  cam.lookAt(look);

  renderer.render(scene, cam);
  document.title = "done";
}
main().catch(e => { document.title = "error: " + e.message; console.error(e); });
</script>
</body>
</html>
