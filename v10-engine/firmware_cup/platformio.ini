; PlatformIO build of the Cup Lite controller (Seeed XIAO ESP32-C3).
;   pio run -t upload          (XIAO on USB-C)
;   pio device monitor         (115200 baud console)
; Host tests: g++ -std=c++17 -O2 -Wall -Wextra -I src test/test_cup_logic.cpp -o t && ./t
; API compile check without the toolchain: g++ -std=gnu++17 -fsyntax-only -I test/stubs -I src src/main.cpp
[env:xiao_c3]
platform = espressif32@6.9.0          ; = Arduino-ESP32 2.0.17 (ledcSetup / ledcAttachPin API)
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -Wall -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
