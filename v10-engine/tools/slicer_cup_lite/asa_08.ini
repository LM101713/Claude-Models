# Cup Lite slicing profile for PrusaSlicer 2.7 CLI: a Bambu-class CoreXY (H2S / P1S speeds and
# accelerations), 0.8 mm nozzle, 0.40 mm layers, ASA. PrusaSlicer has no Bambu profile, so this
# imitates one; the time is set mostly by max_volumetric_speed (the hotend's melt rate), which
# tools/cup_lite_slice.py overrides per run.
gcode_flavor = marlin2
machine_limits_usage = time_estimate_only
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.8
filament_diameter = 1.75
filament_density = 1.07
filament_cost = 25
temperature = 260
first_layer_temperature = 260
bed_temperature = 100
first_layer_bed_temperature = 100
layer_height = 0.4
first_layer_height = 0.4
min_layer_height = 0.16
max_layer_height = 0.56
perimeters = 2
extrusion_width = 0.85
perimeter_extrusion_width = 0.85
external_perimeter_extrusion_width = 0.85
infill_extrusion_width = 0.9
solid_infill_extrusion_width = 0.9
top_infill_extrusion_width = 0.85
first_layer_extrusion_width = 0.9
support_material_extrusion_width = 0.8
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 10%
fill_pattern = gyroid
infill_every_layers = 1
max_volumetric_speed = 18
perimeter_speed = 200
external_perimeter_speed = 150
small_perimeter_speed = 50
infill_speed = 270
solid_infill_speed = 200
top_solid_infill_speed = 150
gap_fill_speed = 100
bridge_speed = 50
support_material_speed = 150
support_material_interface_speed = 80
first_layer_speed = 50
travel_speed = 500
default_acceleration = 10000
perimeter_acceleration = 5000
external_perimeter_acceleration = 5000
infill_acceleration = 10000
solid_infill_acceleration = 8000
top_solid_infill_acceleration = 3000
bridge_acceleration = 3000
first_layer_acceleration = 500
travel_acceleration = 12000
machine_max_acceleration_extruding = 20000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 1500
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 30
machine_max_feedrate_e = 60
machine_max_jerk_x = 9
machine_max_jerk_y = 9
machine_max_jerk_z = 3
machine_max_jerk_e = 3
retract_length = 0.8
retract_speed = 40
support_material = 0
support_material_auto = 1
support_material_style = organic
support_material_buildplate_only = 1
support_material_threshold = 50
support_material_contact_distance = 0.25
skirts = 0
brim_width = 0
avoid_crossing_perimeters = 0
