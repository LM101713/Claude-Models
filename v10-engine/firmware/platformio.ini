; PlatformIO build of the V10 engine controller.
;   pio run -t upload          (ESP32-DevKitC on USB)
;   pio device monitor         (115200 baud console)
; Versions are pinned: this exact set was compile-tested (Arduino-ESP32 2.0.17).
[platformio]
src_dir = v10_engine

[env:esp32dev]
platform = espressif32@6.9.0          ; = Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall
lib_deps =
    gin66/FastAccelStepper@1.3.4
    teemuatlut/TMCStepper@0.7.3
    adafruit/Adafruit NeoPixel@1.15.5
