<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DRYDOCK Studio</title>
<style>
html,body{margin:0;background:#16181c;overflow:hidden;font-family:"Inter","DejaVu Sans",sans-serif}
canvas{display:block}
#ov{position:absolute;left:0;top:0;pointer-events:none}
.lab{position:absolute;color:#e9ecf1;font-weight:600;font-size:22px;letter-spacing:.3px;white-space:nowrap;transform:translate(0,-50%)}
.lab.left{transform:translate(-100%,-50%)}
#title{position:absolute;left:46px;top:34px;color:#fff}
#title .t1{font-size:34px;font-weight:800;letter-spacing:6px}
#title .t1 b{color:#ff6a13}
#title .t2{font-size:18px;font-weight:500;color:#9aa3b2;margin-top:6px;letter-spacing:1px}
</style>
<script type="importmap">
{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}
</script>
</head>
<body>
<svg id="ov"></svg>
<div id="title"><div class="t1">DRY<b>DOCK</b></div><div class="t2" id="sub"></div></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 1600), H = +(q.get("h") || 1200);
const view = q.get("view") || "hero";
document.getElementById("sub").textContent = q.get("sub") || "";
if (q.get("title") === "0") document.getElementById("title").style.display = "none";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
scene.background = new THREE.Color("#16181c");

function mat(kind) {
  const c = new THREE.Color({ charcoal: "#2b2d31", orange: "#ff6a13", clear: "#d8eef5", spool: "#c4c8cf",
                              filament: "#3567c9", bead: "#ff8c1a" }[kind] || "#888");
  if (kind === "clear") return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.15, transmission: 0.85,
                                       thickness: 1.2, ior: 1.57, transparent: true, opacity: 0.55 });
  if (kind === "charcoal") return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.55, metalness: 0.0,
                                       clearcoat: 0.25, clearcoatRoughness: 0.5, sheen: 0.2 });
  if (kind === "orange") return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.45, clearcoat: 0.3 });
  if (kind === "spool") return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.35, transmission: 0.0,
                                       transparent: true, opacity: 0.9 });
  if (kind === "filament") return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.3, clearcoat: 0.6 });
  return new THREE.MeshStandardMaterial({ color: c });
}

const PRESET = {
  hero:      { axis: "tilt", dir: [1.0, -1.45, 0.75], fov: 22, pad: 0.82 },
  exploded:  { axis: "x", dir: [0.25, -1.0, 0.42], fov: 20, pad: 0.8 },
  section:   { axis: "z", dir: [0.55, 1.0, 0.38], fov: 22, pad: 1.2 },
  spool:     { axis: "x", dir: [0.5, 1.0, 0.6], fov: 22, pad: 1.0 },
  expansion: { axis: "x", dir: [0.2, -1.0, 0.45], fov: 20, pad: 0.8 },
  expansion_exploded: { axis: "x", dir: [0.2, -1.0, 0.5], fov: 20, pad: 0.78 },
  label:     { axis: "z", dir: [1.0, -1.45, 0.2], fov: 12, pad: 0.55 },
  adapters:  { axis: "z", dir: [0.0, -0.55, 1.0], fov: 22, pad: 1.12 },
  capface:   { axis: "z", dir: [0.35, -0.6, 1.0], fov: 22, pad: 0.95 },
};

async function main() {
  const p = PRESET[view];
  const meta = await (await fetch(q.get("meta"))).json();
  const gltf = await new GLTFLoader().loadAsync(q.get("glb"));
  const root = new THREE.Group();
  const model = gltf.scene;
  const byName = {};
  for (const prt of meta.parts) byName[prt.name] = prt;
  model.traverse(o => {
    if (!o.isMesh) return;
    const prt = byName[o.name] || byName[o.parent && o.parent.name];
    o.geometry = o.geometry.toNonIndexed(); o.geometry.computeVertexNormals();
    o.material = mat(prt ? prt.kind : "x"); o.material.side = THREE.DoubleSide;
    o.castShadow = o.receiveShadow = true;
  });
  if (meta.beads && meta.beads.length) {
    const g = new THREE.SphereGeometry(1.7, 16, 12);
    const im = new THREE.InstancedMesh(g, new THREE.MeshPhysicalMaterial({ roughness: 0.25, clearcoat: 0.8, transmission: 0.25, thickness: 1 }), meta.beads.length);
    const m4 = new THREE.Matrix4(); const col = new THREE.Color();
    meta.beads.forEach((b, i) => {
      m4.makeTranslation(b[0], b[1], b[2]); im.setMatrixAt(i, m4);
      const t = Math.sin(i * 12.9898) * 43758.5453; const r = t - Math.floor(t);
      col.set(r < 0.5 ? "#ff7a12" : r < 0.85 ? "#ff9426" : "#f2a33a"); im.setColorAt(i, col);
    });
    im.castShadow = im.receiveShadow = true;
    model.add(im);
  }
  const spin = new THREE.Group(); spin.add(model); root.add(spin);
  spin.rotation.z = THREE.MathUtils.degToRad(+(q.get("rotz") || 0));
  if (p.axis === "x") root.rotation.y = Math.PI / 2;
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  // floor
  const floorZ = box.min.z - 0.5;
  const fc = document.createElement("canvas"); fc.width = fc.height = 1024;
  const g2 = fc.getContext("2d"); const grd = g2.createRadialGradient(512, 512, 10, 512, 512, 512);
  grd.addColorStop(0, "#3a3f49"); grd.addColorStop(0.5, "#24272d"); grd.addColorStop(1, "#16181c");
  g2.fillStyle = grd; g2.fillRect(0, 0, 1024, 1024);
  const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace;
  const span = Math.max(size.x, size.y, size.z) * 4;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(span, span), new THREE.MeshStandardMaterial({ map: ft, roughness: 0.9 }));
  floor.position.set(ctr.x, ctr.y, floorZ); floor.receiveShadow = true; scene.add(floor);
  // lights
  const key = new THREE.DirectionalLight("#ffffff", 2.4);
  key.position.set(ctr.x - span * 0.4, ctr.y - span * 0.6, ctr.z + span * 0.9); key.target.position.copy(ctr);
  key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
  const sc = span * 0.5; Object.assign(key.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, near: 0.1, far: span * 4 });
  key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02;
  scene.add(key, key.target);
  const rim = new THREE.DirectionalLight("#ffb27a", 0.9); rim.position.set(ctr.x + span, ctr.y + span * 0.7, ctr.z + span * 0.3); scene.add(rim);
  const fill = new THREE.DirectionalLight("#9fb4d9", 0.5); fill.position.set(ctr.x + span, ctr.y - span, ctr.z); scene.add(fill);
  // camera: fit bounding sphere
  const cam = new THREE.PerspectiveCamera(p.fov, W / H, 1, 5000);
  const dir = new THREE.Vector3(...p.dir).normalize();
  const rad = size.length() / 2;
  const dist = rad * p.pad / Math.sin(THREE.MathUtils.degToRad(p.fov / 2)) * (W > H ? 1 : H / W);
  const aim = ctr.clone(); if (q.get("dy")) aim.z += +q.get("dy");
  cam.position.copy(aim).addScaledVector(dir, dist * (+(q.get("zoom") || 1)));
  cam.lookAt(aim);
  renderer.render(scene, cam);
  // labels
  const ov = document.getElementById("ov"); ov.setAttribute("width", W); ov.setAttribute("height", H);
  const proj = v => { const w = v.clone().applyMatrix4(root.matrixWorld).project(cam); return [(w.x + 1) / 2 * W, (1 - w.y) / 2 * H]; };
  const lab = (txt, from, to, left) => {
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "path");
    ln.setAttribute("d", `M${from[0]},${from[1]} L${to[0]},${to[1]}`); ln.setAttribute("stroke", "#ff6a13");
    ln.setAttribute("stroke-width", "2"); ln.setAttribute("fill", "none"); ov.appendChild(ln);
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", from[0]); dot.setAttribute("cy", from[1]); dot.setAttribute("r", 4); dot.setAttribute("fill", "#ff6a13"); ov.appendChild(dot);
    const d = document.createElement("div"); d.className = "lab" + (left ? " left" : ""); d.textContent = txt;
    d.style.left = (to[0] + (left ? -10 : 10)) + "px"; d.style.top = to[1] + "px"; document.body.appendChild(d);
  };
  if (q.get("labels") !== "0") {
    let alt = 0;
    meta.parts.forEach(prt => {
      if (!prt.label) return;
      let a;
      const mesh = model.getObjectByName(prt.name);
      const b = new THREE.Box3().setFromObject(mesh);
      if (view === "adapters") { const c = b.getCenter(new THREE.Vector3()); const s = proj(new THREE.Vector3(c.x, b.min.y, 0).applyMatrix4(root.matrixWorld.clone().invert()));
        const d = document.createElement("div"); d.className = "lab"; d.style.left = (s[0] - 40) + "px"; d.style.top = (s[1] + 26) + "px"; d.textContent = prt.label; document.body.appendChild(d); return; }
      const c = b.getCenter(new THREE.Vector3());
      const up = (prt.side || (alt++ % 2 === 0 ? "up" : "down")) === "up";
      const pt = new THREE.Vector3(c.x, c.y, up ? b.max.z : b.min.z);
      const s = (() => { const w = pt.clone().project(cam); return [(w.x + 1) / 2 * W, (1 - w.y) / 2 * H]; })();
      lab(prt.label, s, [s[0] + 24, s[1] + (up ? -(prt.lift || 110) : (prt.lift || 110))], false);
    });
    (meta.callouts || []).forEach((co, i) => {
      const pt = new THREE.Vector3(co.r * 0.0 + 0, -co.r * 0.0, co.at[2]);
      const a = new THREE.Vector3(-co.r, 0, co.at[2]);
      const w = a.clone().applyMatrix4(root.matrixWorld).project(cam); const s = [(w.x + 1) / 2 * W, (1 - w.y) / 2 * H];
      lab(co.text, s, [s[0] + (co.dx || 260), s[1] + (co.dy || 0)], false);
    });
  }
  document.title = "done";
}
main().catch(e => { document.title = "error " + e; console.error(e); });
</script>
</body>
</html>
